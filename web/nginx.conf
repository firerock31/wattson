server {
    listen 80;
    root /usr/share/nginx/html;
    index rivian-dashboard.html;

    # Favicons live in ./static, not ./www.
    location = /favicon.ico {
        alias /usr/share/nginx/html-static/favicon.ico;
    }
    location = /apple-touch-icon.png {
        alias /usr/share/nginx/html-static/apple-touch-icon.png;
    }

    # DC charging-cost API (Flask). The dashboard POSTs here when you
    # record what you paid at a public fast charger.
    location /api/ {
        proxy_pass http://api:5000;
        proxy_set_header Host $http_host;
    }

    # Never cache the dashboard HTML: it rebuilds after every poll.
    location / {
        try_files $uri $uri/ /rivian-dashboard.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
